services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: jdbc:postgresql://db:5432/tasks
      DATABASE_USER: tasks
      DATABASE_PASSWORD: tasks
      JWT_SECRET: ktor-tasks-platform-dev-secret-32b
    ports:
      - "8080:8080"
